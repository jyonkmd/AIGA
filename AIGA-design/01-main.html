
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
    * { font-family: 'Pretendard', -apple-system, sans-serif; }
  .phone-wrap { display:flex; justify-content:center; padding:1.5rem 0; }
  .phone {
    width:375px; height:328px; border-radius:4px;
    border:2px solid rgba(180,180,220,0.2); overflow:hidden;
    position:relative; background:#fdf8ff;
  }

  /* 배경 - 연한 그라데이션 */
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(252,209,200,0.25) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(183,239,255,0.25) 0%, transparent 55%),
      radial-gradient(ellipse at 60% 30%, rgba(255,255,255,0.2) 0%, transparent 45%),
      #fdf8ff;
    animation: bgMove 8s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0%   { background-position: 0% 0%, 100% 100%, 50% 0%, 0% 0%; }
    50%  { background-position: 60% 40%, 40% 60%, 80% 60%, 0% 0%; }
    100% { background-position: 50% 100%, 50% 0%, 20% 50%, 0% 0%; }
  }

  /* 콘텐츠 레이아웃 */
  .content {
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; padding:0 24px 60px;
  }

  /* 로고 래퍼 */
  .logo-wrap {
    opacity:0; transform:translateY(20px);
    transition:opacity 0.7s ease, transform 0.7s ease;
    margin-bottom:48px;
    position:relative;
    width:60px; height:60px;
    display:flex; align-items:center; justify-content:center;
  }

  /* 오로라 링 - 기본 */
  .aurora-ring {
    position:absolute;
    width:100%; height:100%;
    border-radius:50%;
    filter:blur(8px);
    opacity:0.6;
    z-index:0;
  }
  .aurora-ring::before {
    content:'';
    position:absolute; width:100%; height:100%; border-radius:50%;
    filter:blur(12px);
    animation:rotateOrganic1 4s linear infinite;
  }
  .aurora-ring::after {
    content:'';
    position:absolute; width:100%; height:100%; border-radius:50%;
    background: conic-gradient(
      from 180deg,
      #7EFF96 0%, #FF568B 10%, #FCD4CC 20%,
      #7EFF96 50%, #4cc9f0 60%, #7b2cbf 70%, #7EFF96 100%
    );
    filter:blur(20px);
    animation:rotateOrganic2 2.5s linear infinite;
  }

  /* 오로라 링 - 타원 궤도 */
  .aurora-ring-extra {
    position:absolute;
    width:130%; height:90%;
    border-radius:50%;
    opacity:0.5;
    z-index:0;
    animation:spinOvalOrbit 8s linear infinite;
  }
  .aurora-ring-extra::before {
    content:'';
    position:absolute; width:100%; height:100%; border-radius:50%;
    background: conic-gradient(
      from 25deg,
      #7EFFF9 0%, rgba(123,44,191,0) 30%,
      #00d2ff 50%, rgba(123,44,191,0) 80%, #7EFFF9 100%
    );
    filter:blur(28px);
    animation:rotateOrganic3 3.5s linear infinite reverse;
  }

  /* 로고 내부 원 */
  .logo-inner-circle {
    position:relative; z-index:2;
    width:60px; height:60px; border-radius:50%;
    background:#ffffff;
    box-shadow:0 2px 16px rgba(120,100,200,0.15);
    display:flex; align-items:center; justify-content:center;
  }

  /* 텍스트 */
  .greeting {
    opacity:0; transform:translateY(16px);
    transition:opacity 0.6s ease, transform 0.6s ease;
    font-size:19px; color:#222; margin-bottom:6px;
    font-family:var(--font-sans);
  }
  .headline {
    opacity:0; transform:translateY(16px);
    transition:opacity 0.6s ease, transform 0.6s ease;
    font-size:20px; font-weight:700; color:#1a1a2e;
    text-align:center; margin-bottom:32px; line-height:1.4;
    font-family:var(--font-sans);
  }

  /* 인풋 */
  .input-wrap {
    opacity:0; transform:translateY(14px);
    transition:opacity 0.6s ease, transform 0.6s ease;
    width:100%;
  }
  .fake-input {
    /*width:100%;*/ height:52px; border-radius:28px;
    background:rgba(255,255,255,0.85);
    border:1px solid rgba(180,180,220,0.3);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 8px 0 20px;
    box-shadow: 0 0 40px 0 rgba(70, 184, 255, 0.20);
  }
  .input-text-wrap {
    flex:1; min-width:0;
    position:relative; height:20px; overflow:hidden;
  }
  .input-phrase {
    position:absolute; left:0; top:0; width:100%;
    font-size:15px; font-family:var(--font-sans);
    color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transform:translateY(10px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .send-btn {
    width:36px; height:36px; border-radius:50%;
    background:#4E87F4;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-left:8px;
  }

  /* 오로라 애니메이션 */
  @keyframes rotateOrganic1 {
    0%   { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  @keyframes rotateOrganic2 {
    0%   { transform:rotate(0deg); }
    100% { transform:rotate(-360deg); }
  }
  @keyframes rotateOrganic3 {
    0%   { transform:rotate(0deg); }
    100% { transform:rotate(-360deg); }
  }
  @keyframes spinOvalOrbit {
    0%   { transform:rotate(-20deg); }
    100% { transform:rotate(340deg); }
  }
</style>

<div class="phone-wrap">
  <div class="phone">
    <div class="bg"></div>
    <div class="content">

      <!-- 로고 + 오로라 -->
      <div class="logo-wrap" id="logo">
        <div class="aurora-ring"></div>
        <div class="aurora-ring-extra"></div>
        <div class="logo-inner-circle">
          <img src="https://raw.githubusercontent.com/jyonkmd/AIGA/refs/heads/main/AIGA-design/img/logo_symbol.svg" width="37px">
        </div>
      </div>

      <div class="greeting" id="greet">안녕하세요.</div>
      <div class="headline" id="head">어떤 증상으로 힘드신가요?</div>

      <div class="input-wrap" id="inp">
        <div class="fake-input">
          <div class="input-text-wrap" id="phraseWrap"></div>
          <div class="send-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8H14M9 3L14 8L9 13"/>
            </svg>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // 순차 등장
  function show(id, delay) {
    setTimeout(() => {
      const el = document.getElementById(id);
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, delay);
  }
  show('logo', 400);
  show('greet', 1100);
  show('head', 1600);
  show('inp', 2300);

  // 인풋 질문 순환 (fade in up)
  const phrases = [
    '폐암 수술 잘 하는 의사 찾아줘',
    '두통이 3일째 지속되고 있어요',
    '소화가 안 되고 배가 아파요',
    '당뇨 관리 잘 하는 병원 추천해줘',
    '허리 통증이 심해서 MRI 찍고 싶어요'
  ];
  const wrap = document.getElementById('phraseWrap');
  phrases.forEach((txt) => {
    const el = document.createElement('span');
    el.className = 'input-phrase';
    el.textContent = txt;
    wrap.appendChild(el);
  });

  let cur = 0;
  const SHOW = 2200, FADE = 500;

  function cyclePhrase() {
    const els = wrap.querySelectorAll('.input-phrase');
    els[cur].style.opacity = '0';
    els[cur].style.transform = 'translateY(-10px)';
    setTimeout(() => {
      els[cur].style.transform = 'translateY(10px)';
      cur = (cur + 1) % phrases.length;
      els[cur].style.opacity = '1';
      els[cur].style.transform = 'translateY(0)';
      setTimeout(cyclePhrase, SHOW);
    }, FADE);
  }

  setTimeout(() => {
    wrap.querySelectorAll('.input-phrase')[0].style.opacity = '1';
    wrap.querySelectorAll('.input-phrase')[0].style.transform = 'translateY(0)';
    setTimeout(cyclePhrase, SHOW);
  }, 2800);
</script>
